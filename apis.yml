- name: Dragos Platform SiteStore API
  description: >-
    Customer-gated Dragos Platform SiteStore v2 API for tenants to read OT assets and alerts from their
    monitoring platform. Per-tenant host of the form https://<company>.platform.dragos.cloud. Authenticated
    with an OAuth 2.0 Bearer (JWT) access token (recommended) or a static API key, with role-based access
    such as asset:read. SiteStore 1.1 API remains available for a limited time for backward compatibility.
